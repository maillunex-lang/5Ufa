# Автодеплой на VPS при push в main. Использует секреты, уже настроенные в репозитории:
# VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_APP_DIR
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy-production, cancel-in-progress: false }
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Настройка SSH
        env: { SSH_KEY: '${{ secrets.VPS_SSH_KEY }}', KNOWN_HOSTS: '${{ secrets.VPS_KNOWN_HOSTS }}' }
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Деплой на VPS
        env: { HOST: '${{ secrets.VPS_HOST }}', PORT: '${{ secrets.VPS_PORT }}', USER: '${{ secrets.VPS_USER }}', APP_DIR: '${{ secrets.VPS_APP_DIR }}' }
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          HOST="$(trim "$HOST")"; PORT="$(trim "$PORT")"; USER="$(trim "$USER")"; APP_DIR="$(trim "$APP_DIR")"
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 \
            "$USER@$HOST" "cd '$APP_DIR' && git fetch --quiet https://github.com/${{ github.repository }}.git +main:refs/remotes/origin/main && git checkout --quiet origin/main -- scripts/deploy.sh && bash scripts/deploy.sh main"
      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
