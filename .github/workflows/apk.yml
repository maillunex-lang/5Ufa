# Сборка APK игры: Godot headless export -> подпись -> GitHub Releases.
# Запускается при изменениях в client/ в ветке main, либо вручную (Actions -> APK -> Run workflow).
#
# Секреты для подписи (Settings -> Secrets and variables -> Actions), см. docs/apk-signing.md:
#   ANDROID_KEYSTORE_BASE64   — файл ключа release.keystore в base64
#   ANDROID_KEYSTORE_PASSWORD — пароль ключа
#   ANDROID_KEY_ALIAS         — имя ключа (alias), например ufa
# Если секретов нет — APK подписывается временным ключом и выкладывается только
# как артефакт сборки (не в Releases): такой APK годится для проверки, но обновлять его нельзя.
name: APK

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/build-apk.sh"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
    inputs:
      mandatory:
        description: "Обязательное обновление (старые версии не пустит в игру)"
        type: boolean
        default: false
      notes:
        description: "Что нового (покажется игрокам). Пусто — заголовок последнего коммита"
        type: string
        default: ""

concurrency:
  group: apk-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  SERVER_URL: "https://tts-ufa.ru/games/server"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш Godot и шаблонов экспорта
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Установка Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o tpl.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz && rm tpl.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Android build-tools (apksigner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" "platform-tools" >/dev/null
          ls "$ANDROID_HOME/build-tools"

      - name: Ключ подписи
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$KS"
            ALIAS="$(printf '%s' "$KS_ALIAS" | tr -d '[:space:]')"
            PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n')"
            echo "temp=false" >> "$GITHUB_OUTPUT"
            echo "Используется постоянный ключ подписи"
          else
            ALIAS=temp; PASS="temp-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Temporary build key" >/dev/null
            echo "temp=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты ключа подписи не заданы — APK подписан ВРЕМЕННЫМ ключом (см. docs/apk-signing.md)"
          fi
          echo "::add-mask::$PASS"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Сборка APK
        id: build
        env:
          GODOT: ~/godot/godot
        run: |
          BASE="$(grep -oP '^config/version="\K[0-9]+\.[0-9]+' client/project.godot)"
          export VERSION_NAME="$BASE.${{ github.run_number }}"
          export VERSION_CODE="${{ github.run_number }}"
          export ANDROID_SDK="$ANDROID_HOME"
          export GODOT="$HOME/godot/godot"
          bash scripts/build-apk.sh
          cp client/build/ufa.apk "client/build/ufa-$VERSION_NAME.apk"

      - name: Сборка APK админки (lunex.ufa.admin)
        env:
          V: ${{ steps.build.outputs.version_name }}
        run: |
          export VERSION_NAME="$V"
          export VERSION_CODE="${{ github.run_number }}"
          export ANDROID_SDK="$ANDROID_HOME"
          export GODOT="$HOME/godot/godot"
          export PRESET="Admin Android"
          export OUT="$PWD/client/build/ufa-admin-$V.apk"
          bash scripts/build-apk.sh
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$OUT" | grep -q "^package: name='lunex.ufa.admin'"

      - name: Сборка веб-версии админки
        run: GODOT="$HOME/godot/godot" bash scripts/build-admin-web.sh

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ufa-${{ steps.build.outputs.version_name }}${{ steps.keystore.outputs.temp == 'true' && '-TEMPKEY' || '' }}
          path: |
            client/build/ufa-${{ steps.build.outputs.version_name }}.apk
            client/build/ufa-admin-${{ steps.build.outputs.version_name }}.apk
            client/build/admin-web.zip
          retention-days: 30

      - name: Публикация в Releases
        if: steps.keystore.outputs.temp == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.build.outputs.version_name }}
          SIZE: ${{ steps.build.outputs.apk_size_mb }}
        run: |
          gh release create "client-v$V" "client/build/ufa-$V.apk" "client/build/ufa-admin-$V.apk" \
            --title "Игра $V" \
            --notes "Сборка из коммита ${GITHUB_SHA::8}. Размер APK игры: $SIZE МБ. Android 12+.

          Установка: скачайте ufa-$V.apk на телефон и откройте файл (разрешите установку из этого источника).
          Админка: ufa-admin-$V.apk — отдельное приложение; войти можно только с логином и паролем администратора."

      - name: Загрузка на сервер (обновление внутри игры)
        if: steps.keystore.outputs.temp == 'false'
        env:
          TOKEN: ${{ secrets.CLIENT_UPLOAD_TOKEN }}
          V: ${{ steps.build.outputs.version_name }}
          CODE: ${{ github.run_number }}
          MANDATORY: ${{ inputs.mandatory && 'true' || 'false' }}
          NOTES_IN: ${{ inputs.notes }}
        run: |
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Нет секрета CLIENT_UPLOAD_TOKEN — игроки не получат это обновление внутри игры (см. docs/app-updates.md)"
            exit 0
          fi
          NOTES="${NOTES_IN:-$(git log -1 --format=%s)}"
          NOTES_B64="$(printf '%s' "$NOTES" | base64 -w0)"
          URL="$SERVER_URL/api/v1/client/releases/$CODE?version_name=$V&mandatory=$MANDATORY"
          # Сервер мог ещё не обновиться (деплой идёт параллельно) — несколько попыток
          for i in $(seq 1 10); do
            CODE_HTTP=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X PUT --data-binary "@client/build/ufa-$V.apk" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "X-Upload-Token: $TOKEN" -H "X-Notes: $NOTES_B64" "$URL" || echo 000)
            echo "Попытка $i: HTTP $CODE_HTTP $(head -c 300 /tmp/resp.txt)"
            case "$CODE_HTTP" in
              200) echo "APK $V загружен на сервер — игроки получат предложение обновиться"; exit 0 ;;
              403|409|413|422) exit 1 ;;
            esac
            sleep 30
          done
          exit 1

      - name: Загрузка веб-админки на сервер (/admin/)
        if: steps.keystore.outputs.temp == 'false'
        env:
          TOKEN: ${{ secrets.CLIENT_UPLOAD_TOKEN }}
          V: ${{ steps.build.outputs.version_name }}
        run: |
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          [ -z "$TOKEN" ] && { echo "::warning::Нет CLIENT_UPLOAD_TOKEN — веб-админка не обновлена"; exit 0; }
          for i in $(seq 1 10); do
            CODE_HTTP=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X PUT --data-binary "@client/build/admin-web.zip" \
              -H "Content-Type: application/zip" -H "X-Upload-Token: $TOKEN" "$SERVER_URL/api/v1/admin-web/$V" || echo 000)
            echo "Попытка $i: HTTP $CODE_HTTP $(head -c 200 /tmp/resp.txt)"
            [ "$CODE_HTTP" = "200" ] && { echo "Веб-админка $V: $SERVER_URL/admin/"; exit 0; }
            case "$CODE_HTTP" in 403|422) exit 1 ;; esac
            sleep 30
          done
          exit 1

      - name: Итог
        run: |
          echo "### APK ${{ steps.build.outputs.version_name }} — ${{ steps.build.outputs.apk_size_mb }} МБ" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.keystore.outputs.temp }}" = "true" ]; then
            echo "Подписан временным ключом: скачайте из раздела Artifacts этой сборки." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Опубликован в Releases: client-v${{ steps.build.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          fi
