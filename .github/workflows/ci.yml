# Проверки: тесты сервера, проверка контента по схемам, проверка docker-compose.
# Запускается на каждый push в любую ветку и в pull request,
# а также вызывается из deploy.yml перед деплоем.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  android-export:
    # Проверка Gradle и нативного модуля уведомлений без публикации APK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        id: godot-export-cache
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2
      - name: Установка Godot и шаблонов
        if: steps.godot-export-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          BASE=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fsSL -o godot.zip "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v* godot && chmod +x godot
          curl -fsSL -o templates.tpz "$BASE/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Проверка сборки APK с временным ключом
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storetype PKCS12 -alias test \
            -keyalg RSA -keysize 2048 -validity 7 -storepass temporary123 -keypass temporary123 \
            -dname 'CN=Temporary test key' >/dev/null
          export GODOT="$HOME/godot/godot"
          export ANDROID_SDK="$ANDROID_HOME"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/test.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=test
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=temporary123
          bash scripts/build-apk.sh
          AAPT="$(find "$ANDROID_SDK/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump xmltree client/build/ufa.apk AndroidManifest.xml > /tmp/ufa-manifest.txt
          grep -q 'org.godotengine.plugin.notification.NotificationReceiver' /tmp/ufa-manifest.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/ufa-manifest.txt
          # Без этого разрешения перестанет работать обновление из игры
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/ufa-manifest.txt
          # ID приложения не должен меняться — иначе обновление не встанет поверх
          "$AAPT" dump badging client/build/ufa.apk | grep -q "^package: name='lunex.ufa'"
          if grep -Eq 'android.permission.(SCHEDULE_EXACT_ALARM|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)' /tmp/ufa-manifest.txt; then
            echo 'Обнаружено лишнее разрешение уведомлений' >&2
            exit 1
          fi
          unzip -Z1 client/build/ufa.apk > /tmp/ufa-apk-files.txt
          grep -q '^lib/arm64-v8a/' /tmp/ufa-apk-files.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/ufa-apk-files.txt; then
            echo 'APK содержит неподдерживаемую архитектуру' >&2
            exit 1
          fi

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r server/requirements-dev.txt

      - name: Тесты сервера
        working-directory: server
        run: pytest -q

      - name: Проверка базового контента по JSON Schema
        working-directory: server
        env:
          SHARED_DIR: ${{ github.workspace }}/shared
          BASE_CONTENT_DIR: ${{ github.workspace }}/content
        run: python -m app.cli content validate

      - name: Проверка docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

  client-e2e:
    # Настоящий клиент Godot (headless) против настоящего сервера в Docker:
    # вход гостем, манифест, загрузка всех пакетов, проверка SHA-256.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Кэш Godot
        id: godot-bin
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-bin-${{ env.GODOT_VERSION }}

      - name: Установка Godot
        if: steps.godot-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v* godot && chmod +x godot

      - name: Запуск сервера
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci$(openssl rand -hex 8)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 16)/" .env
          sed -i "s/^PUBLIC_PATH_PREFIX=.*/PUBLIC_PATH_PREFIX=/" .env
          sed -i "s/^CLIENT_UPLOAD_TOKEN=.*/CLIENT_UPLOAD_TOKEN=ci-token/" .env
          docker compose build -q
          docker compose up -d postgres redis
          docker compose run --rm -T api alembic upgrade head
          docker compose run --rm -T api python -m app.cli content import --publish
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8085/health && break; sleep 2; done

      - name: Автопроверка клиента
        working-directory: client
        run: |
          G=~/godot-bin/godot
          $G --headless --path . --import >/dev/null 2>&1 || true
          run() {
            local rc=0
            timeout 180 $G --headless --path . -- --server=http://127.0.0.1:8085 --autotest "$@" > /tmp/out.txt 2>&1 || rc=$?
            grep -E "AUTOTEST|SCRIPT ERROR|ERROR:" /tmp/out.txt || true
            [ "$rc" -eq 0 ] && grep -qE "AUTOTEST (RESULT|UPDATE)" /tmp/out.txt
          }
          echo "--- первый запуск: гость, загрузка всего контента"
          run
          echo "--- привязка почты"
          run --autotest-link=ci@example.com:abcd1234
          grep -q '"ok":true' /tmp/out.txt
          echo "--- «другой телефон»: вход по почте"
          rm -rf ~/.local/share/godot/app_userdata
          run --autotest-login=ci@example.com:abcd1234
          grep -q '"ok":true' /tmp/out.txt
          echo "--- тестовый бой: сервер считает, клиент проигрывает журнал до экрана результата"
          run --autotest-battle
          grep -q 'AUTOTEST BATTLE: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          echo "--- живой бой: WebSocket и досчёт при пропуске"
          run --autotest-live-battle
          grep -q 'AUTOTEST BATTLE: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          echo "--- кампания: загрузка карты и первый бой"
          run --autotest-campaign
          grep -q 'AUTOTEST CAMPAIGN: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          run --autotest-campaign-battle
          grep -q 'AUTOTEST BATTLE: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          run --autotest-campaign-live
          grep -q 'AUTOTEST BATTLE: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          echo "--- герои и призыв: стартовый набор, понятная ошибка без золота, призыв x10"
          run --autotest-heroes
          grep -q 'AUTOTEST HEROES: {.*"ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          echo "--- обновление приложения: загружаем «новую версию», клиент её скачивает и проверяет"
          { printf 'PK\003\004'; head -c 300000 /dev/urandom; } > /tmp/fake.apk
          curl -fsS -X PUT --data-binary @/tmp/fake.apk -H "X-Upload-Token: ci-token" \
            "http://127.0.0.1:8085/api/v1/client/releases/999?version_name=9.9.9"
          run --autotest-update
          grep -q 'AUTOTEST UPDATE: {"error":"","ok":true' /tmp/out.txt || { cat /tmp/out.txt; exit 1; }

      - name: Логи сервера при ошибке
        if: failure()
        run: docker compose logs --tail=100
