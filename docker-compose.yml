# Запуск: ./deploy/redeploy.sh   (или: docker compose up -d --build)
services:
  server:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    ports: ["${BIND:-0.0.0.0}:${PORT:-8080}:8080"]
    volumes: ["5ufa-data:/data"]
volumes:
  5ufa-data:
