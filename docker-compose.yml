# Запуск обычно делает scripts/deploy.sh (GitHub Actions). Вручную:
#   docker compose --env-file .5ufa.env up -d --build
name: 5ufa
services:
  server:
    build: { context: ., dockerfile: server/Dockerfile }
    container_name: 5ufa-server
    restart: unless-stopped
    env_file: [{ path: .5ufa.env, required: false }]
    ports: ["127.0.0.1:${PORT:-8085}:8080"]
    volumes: ["5ufa-data:/data"]
volumes:
  5ufa-data:
