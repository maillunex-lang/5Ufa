<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5Ufa — админка</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>
:root{--bg:#12100e;--card:#1c1814;--card2:#261f18;--fg:#f4ecdf;--mut:#b7aa96;--acc:#c6a15a;--bad:#d46558;--ok:#5fc27e;--line:#3a3228;--magic:#3ecfc4}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
nav{display:none;flex-direction:column;background:var(--card);padding:0 16px 8px}nav.open{display:flex}
nav b{color:var(--mut);font-size:12px;text-transform:uppercase;margin-top:10px}
nav a{padding:7px 0;color:var(--fg);text-decoration:none;cursor:pointer}nav a.cur{color:var(--acc);font-weight:600}nav a.soon{color:var(--mut)}
main{padding:16px;max-width:980px;padding-bottom:110px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid rgba(198,161,90,.45);overflow-wrap:anywhere}
.card small{color:var(--mut);display:block}.card strong{font-size:22px}
button,input,select,textarea{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #333a49;background:#262b36;color:var(--fg)}
button{cursor:pointer;background:var(--acc);color:#1b1500;border:0;font-weight:600}button.sec{background:#2f3542;color:var(--fg)}button.danger{background:#5a2a2a;color:#ffd8d4}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%}input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:40px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{color:var(--mut);font-weight:500}
.bad{color:var(--bad)}.ok{color:var(--ok)}#login{max-width:340px;margin:12vh auto}
.f{display:block;margin-bottom:10px}.f .lb{display:block;color:var(--mut);font-size:13px;margin-bottom:3px}.f small{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#2f3542;color:var(--fg)}.tabs button.on{background:var(--acc);color:#1b1500}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:1 1 140px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .meta{color:var(--mut);font-size:12px}.tag{display:inline-block;font-size:11px;border:1px solid #444c5c;border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--mut)}
.vrow{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}.vrow span{color:var(--mut);margin-right:8px}.vrow .nt{margin-top:2px;word-break:break-word}.vrow button{margin:6px 6px 0 0;padding:6px 10px;font-size:13px}
#savebar{position:fixed;left:0;right:0;bottom:0;background:#2a2f3c;border-top:2px solid var(--acc);padding:10px 16px;z-index:8;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#savebar .t{flex:1 1 100%;font-size:13px}#savebar input{flex:1 1 200px}#savebar .err{flex:1 1 100%;color:var(--bad);font-size:13px;max-height:120px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal>.card{max-width:420px;width:100%;margin:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#0e1016;border-radius:8px;padding:8px}
canvas{max-width:100%;background:#0e1016;border-radius:8px}.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;font-size:13px}.slot{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;align-items:center;margin-bottom:6px;font-size:13px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2f3542;border:1px solid var(--acc);border-radius:8px;padding:8px 14px;z-index:30;display:none}
@media(min-width:900px){nav{display:flex!important;position:fixed;left:0;top:49px;bottom:0;width:210px;overflow:auto}main{margin-left:230px}#menu{display:none}#savebar{padding-left:246px}}
</style>
</head>
<body>
<div id="login" class="card"><h2>Вход владельца</h2>
<input id="l" placeholder="Логин" autocomplete="username"><br><br><input id="p" type="password" placeholder="Пароль" autocomplete="current-password"><br><br>
<button id="go">Войти</button> <span id="lerr" class="bad"></span></div>
<div id="app" hidden>
<header><button id="menu" class="sec">☰</button><h1>5Ufa · админка</h1><button class="sec" id="out">Выйти</button></header>
<nav id="nav"></nav>
<main><div id="view"></div></main>
<div id="savebar" hidden></div>
<div id="toast"></div>
</div>
<script src="app.js"></script>
<script src="world-editor.js"></script>
</body></html>
